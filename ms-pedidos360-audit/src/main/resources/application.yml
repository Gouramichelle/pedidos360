server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-pedidos360-audit
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:audit}
      jakarta.persistence.create-database-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: audit-service

security:
  issuer-uri: ${AZURE_ISSUER_URI}
  audiences: ${AZURE_AUDIENCES}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cl.pedidos360: INFO
