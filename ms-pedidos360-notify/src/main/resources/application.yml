server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-pedidos360-notify
  rabbitmq:
    # Los dos nodos del cluster, separados por coma. Spring los intenta en
    # orden y hace failover al segundo si el primero no responde, que es lo
    # que hace que el cluster sirva de algo y no sea solo decorativo.
    # Sin valor por defecto a proposito: si falta la variable el servicio no
    # arranca, en vez de quedarse esperando a un broker que no existe.
    addresses: ${RABBITMQ_ADDRESSES}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Sin bloque listener.simple.retry a proposito: ese reintento lo hacia el
    # framework en memoria, dentro del mismo consumo y sin que el broker se
    # enterara. Ahora los consumidores corren en modo MANUAL y el reintento es
    # un NACK con requeue de verdad. Ver RabbitListenerConfig y
    # ConfirmacionDeMensajes.

# ms-notify no expone API publica ni valida JWT (es un consumer interno),
# pero mantiene issuer-uri/audiences por si en el futuro se le agrega un
# endpoint de health/administracion protegido.
security:
  issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/placeholder/v2.0}
  audiences: ${AZURE_AUDIENCES:api://placeholder}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cl.pedidos360: INFO
