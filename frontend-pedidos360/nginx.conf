server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API hacia el API Gateway.
    #
    # El navegador ve /api/* en el MISMO origen que el frontend, asi que no
    # dispara preflight ni aplica CORS. Eso evita un problema real: nuestras
    # rutas en el Gateway usan el metodo ANY, que incluye OPTIONS, y como el
    # JWT Authorizer esta attachado a esas rutas, el preflight (que el
    # navegador manda SIN header Authorization) siempre respondia 401 antes
    # de poder devolver los headers de CORS.
    #
    # El API Gateway sigue estando en el camino
    # (navegador -> nginx -> API Gateway -> microservicio), asi que el JWT
    # Authorizer sigue validando el token en el borde, igual que antes.
    location /api/ {
        proxy_pass https://7x6u8dfoh0.execute-api.us-east-1.amazonaws.com/api/;

        # API Gateway enruta por el header Host y exige SNI en el handshake
        # TLS: sin estas dos lineas responde 403 sin llegar a nuestras rutas.
        proxy_set_header Host 7x6u8dfoh0.execute-api.us-east-1.amazonaws.com;
        proxy_ssl_server_name on;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Para el navegador esto es mismo origen, pero el microservicio recibe
        # el Origin del frontend (https://<ip>:8085) y lo compara con su Host
        # (<ip>:808x): lo toma como cross-origin y Spring rechaza con 403 los
        # POST/PUT/PATCH cuyo origen no este en ALLOWED_ORIGINS. Como esa IP
        # cambia en cada sesion del lab, se quita el header y el backend no
        # evalua CORS para lo que llega por este proxy.
        proxy_set_header Origin "";
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (si no, refrescar /orders/5 directamente en el navegador da 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
