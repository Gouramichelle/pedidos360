server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:orders}
      jakarta.persistence.create-database-schemas: true
  rabbitmq:
    # Los dos nodos del cluster, separados por coma. Spring los intenta en
    # orden y hace failover al segundo si el primero no responde, que es lo
    # que hace que el cluster sirva de algo y no sea solo decorativo.
    # Sin valor por defecto a proposito: si falta la variable el servicio no
    # arranca, en vez de quedarse esperando a un broker que no existe.
    addresses: ${RABBITMQ_ADDRESSES}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

services:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}

# Topologia de RabbitMQ, centralizada.
#
# Ningun nombre de cola, exchange, routing key o binding se escribe en el
# codigo Java: RabbitTopologyConfig arma la topologia recorriendo este bloque,
# y los publishers leen de aqui la cola a la que escriben. Agregar un flujo
# nuevo es agregar una entrada bajo "flujos", sin tocar una sola clase.
#
# Este bloque tiene que ser identico en ms-orders y en ms-notify: los dos
# declaran la misma topologia de forma idempotente, y declarar una cola dos
# veces con argumentos distintos falla.
mensajeria:
  exchanges:
    direct: cmd.direct
    topic: cmd.topic
    dlx: cmd.dead.dlx
  flujos:
    # routing-key enruta el comando; patron-topic es el binding del exchange
    # topic, que admite comodines. La DLQ de cada cola cuelga del dlx con la
    # misma routing-key.
    email:
      cola: q.cmd.email
      routing-key: email.send
      patron-topic: email.*
    kitchen:
      cola: q.cmd.kitchen
      routing-key: kitchen.ticket
      patron-topic: kitchen.#
    invoice:
      cola: q.cmd.invoice
      routing-key: invoice.gen
      patron-topic: invoice.*

security:
  issuer-uri: ${AZURE_ISSUER_URI}
  audiences: ${AZURE_AUDIENCES}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cl.pedidos360: INFO
