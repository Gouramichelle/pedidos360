# Los 5 microservicios de Pedidos360, para ec2-apps.
# Cada imagen se construye desde su propio repo (build context relativo);
# en EC2 hay que clonar los 5 repos como hermanos de /infra antes de levantar
# esto, o reemplazar `build:` por `image:` apuntando a un registry.
services:
  ms-orders:
    build: ../../ms-pedidos360-orders
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_SCHEMA: orders
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      CATALOG_SERVICE_URL: http://ms-catalog:8081
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    restart: unless-stopped

  ms-catalog:
    build: ../../ms-pedidos360-catalog
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_SCHEMA: catalog
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    restart: unless-stopped

  ms-notify:
    build: ../../ms-pedidos360-notify
    ports:
      - "8082:8082"
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES}
    restart: unless-stopped

  ms-report:
    build: ../../ms-pedidos360-report
    ports:
      - "8083:8083"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_SCHEMA: report
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    restart: unless-stopped

  frontend:
    build: ../../frontend-pedidos360
    ports:
      # 8085 ya esta abierto en seg-apps (rango 8080-8085), asi no hace falta
      # tocar el security group. Nginx adentro escucha 443 (HTTPS autofirmado,
      # requisito de Azure AD para el redirect URI de una SPA).
      - "8085:443"
    restart: unless-stopped

  ms-audit:
    build: ../../ms-pedidos360-audit
    ports:
      - "8084:8084"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_SCHEMA: audit
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    restart: unless-stopped
