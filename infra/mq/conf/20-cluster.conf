# Formacion del cluster: lista estatica de los dos nodos.
#
# Este archivo se monta en /etc/rabbitmq/conf.d/ y se suma a la configuracion
# de la imagen oficial en vez de reemplazarla. La imagen genera su propio
# conf.d/10-defaults.conf con el default_user/default_pass que vienen por
# variable de entorno y con `loopback_users = none`, que es lo que permite que
# el usuario guest se conecte desde otro host y no solo desde localhost.
# RabbitMQ lee los archivos de conf.d en orden alfabetico, asi que el prefijo
# 20- garantiza que lo nuestro se aplique despues sin tocar esos defaults.
# Montar encima de 10-defaults.conf si los perderia, y los microservicios no
# podrian autenticarse aunque el cluster levantara bien.

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Si los dos nodos se dejan de ver entre si y despues se reencuentran, que el
# cluster se repare solo en vez de quedar partido en dos mitades que aceptan
# escrituras por separado.
cluster_partition_handling = autoheal
