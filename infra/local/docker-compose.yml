# Stack de infraestructura para desarrollo local, sin AWS.
#
# Levanta solo lo que no tiene sentido correr a mano: base de datos, el cluster
# de RabbitMQ y Kafka. Los microservicios NO van aca a proposito: corren en la
# JVM del host con `mvn spring-boot:run -Dspring-boot.run.profiles=local`, que
# evita reconstruir una imagen por cada cambio y permite enganchar el debugger.
#
#   docker compose -f infra/local/docker-compose.yml up -d
#
# Las credenciales de abajo son de desarrollo y estan a la vista a proposito:
# este archivo nunca se usa fuera de localhost.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 5434 y no 5432: el puerto estandar suele estar tomado por otro postgres
      # en la maquina de desarrollo. Dentro del contenedor sigue siendo 5432.
      - "5434:5432"
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos360 -d pedidos360"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Cluster RabbitMQ: misma topologia que en la nube, dos nodos ---
  rabbit1:
    image: rabbitmq:3.13-management
    hostname: rabbit1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: cookie-de-desarrollo-local
    volumes:
      - rabbit1-data:/var/lib/rabbitmq
      - ../mq/conf/20-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbit2:
    image: rabbitmq:3.13-management
    hostname: rabbit2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: cookie-de-desarrollo-local
    volumes:
      - rabbit2-data:/var/lib/rabbitmq
      - ../mq/conf/20-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbit1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Kafka: tres Zookeeper y tres brokers, igual que en la nube ---
  #
  # La misma topologia que infra/kafka/docker-compose.yml, cambiando solo como
  # se anuncian los brokers: aca los microservicios corren en el host, asi que
  # el listener EXTERNAL tiene que decir localhost.
  #
  # Tres de cada uno porque el quorum manda: Zookeeper elige lider por mayoria,
  # y tres brokers permiten replicacion 3 con min.insync 2, que es lo que deja
  # seguir escribiendo si se cae uno.
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper1
    environment: &zk-local
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      ZOOKEEPER_SERVER_ID: 1
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m

  zookeeper2:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper2
    environment:
      <<: *zk-local
      ZOOKEEPER_SERVER_ID: 2

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper3
    environment:
      <<: *zk-local
      ZOOKEEPER_SERVER_ID: 3

  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9092:9092"]
    environment: &kafka-local
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092

  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9093:9093"]
    environment:
      <<: *kafka-local
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9093

  kafka3:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9094:9094"]
    environment:
      <<: *kafka-local
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9094

  # --- Kafka UI: administracion y metricas del cluster ---
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on: [kafka1, kafka2, kafka3]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      AUTH_TYPE: DISABLED
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  postgres-data:
  rabbit1-data:
  rabbit2-data:
